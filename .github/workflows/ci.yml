name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: voting
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: voting_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voting"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://voting:test-only@localhost:5432/voting_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal migrations)"
      - run: make swagger && git diff --exit-code -- api/swagger.yml
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Go security advisories
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: web
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.18.6}
      - run: |
          helm lint deploy/helm/voting --strict --set image.tag=check --set 'networkPolicy.dependencyCIDRs[0]=192.0.2.0/24'
          helm template voting deploy/helm/voting --set image.tag=check --set 'networkPolicy.dependencyCIDRs[0]=192.0.2.0/24' > /tmp/chart.yaml
          if helm template voting deploy/helm/voting --set image.tag=check --set 'networkPolicy.dependencyCIDRs[0]=192.0.2.0/24' --set api.autoscaling.minReplicas=25 --set api.autoscaling.maxReplicas=20 > /dev/null 2>&1; then exit 1; fi
          if helm template voting deploy/helm/voting --set image.tag=check --set 'networkPolicy.dependencyCIDRs[0]=192.0.2.0/24' --set worker.keda.enabled=true --set worker.keda.minReplicas=13 --set worker.keda.maxReplicas=12 --set worker.keda.authenticationRef=test > /dev/null 2>&1; then exit 1; fi
          if helm template voting deploy/helm/voting --set image.tag=check > /dev/null 2>&1; then exit 1; fi
          if helm template voting deploy/helm/voting --set image.tag=check --set networkPolicy.enabled=false --set lifecycle.shutdownTimeoutSeconds=60 --set lifecycle.terminationGracePeriodSeconds=30 > /dev/null 2>&1; then exit 1; fi
          helm template voting deploy/helm/voting --set image.tag=check --set 'networkPolicy.dependencyCIDRs[0]=192.0.2.0/24' --set ingress.enabled=true --set serviceMonitor.enabled=true --set worker.keda.enabled=true --set worker.keda.authenticationRef=test > /tmp/chart-all.yaml
      - name: Kubernetes resource schemas
        run: go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 -strict -ignore-missing-schemas -summary /tmp/chart.yaml /tmp/chart-all.yaml
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.out}
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make init
      - run: docker compose up --build -d
      - name: Wait for readiness
        run: |
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://localhost:8080/readyz; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
      - name: Diagnostics
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop local stack
        if: always()
        run: docker compose down -v
