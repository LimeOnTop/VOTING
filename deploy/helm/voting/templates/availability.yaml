{{- if .Values.pdb.enabled }}
{{- range $component := list "api" "worker" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "voting.name" $ }}-{{ $component }}
spec:
  minAvailable: {{ $.Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "voting.name" . }}
  {{- $annotations := deepCopy .Values.ingress.annotations }}
  {{- if and .Values.ingress.sticky.enabled (eq .Values.ingress.sticky.provider "nginx") }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/affinity" "cookie" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/affinity-mode" "persistent" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/session-cookie-name" .Values.ingress.sticky.cookieName }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/session-cookie-path" "/" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/session-cookie-secure" "true" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/session-cookie-samesite" "Lax" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/session-cookie-change-on-failure" "true" }}
  {{- end }}
  annotations: {{ toYaml $annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "voting.name" . }}-api
                port: {name: http}
{{- end }}
