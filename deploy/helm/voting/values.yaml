image:
  repository: ghcr.io/limeontop/voting
  tag: "" # Required image version or commit SHA.
  pullPolicy: IfNotPresent
imagePullSecrets: []
apiSecret: voting-api-secrets
workerSecret: voting-worker-secrets
migrationSecret: voting-migration-secrets
config:
  kafkaBrokers: kafka.kafka.svc.cluster.local:9092
  kafkaTopic: votes.v1
  kafkaGroup: voting-projector-v1
  kafkaTLS: "true"
  cookieSecure: "true"
  # Non-secret environment overrides; see cmd/config for validated settings.
  env:
    DEDUP_CAPACITY: "1000000"
    DEDUP_RETENTION: "1h"
api:
  replicas: 3
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    cpu: 65
worker:
  replicas: 3
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  keda:
    enabled: false # Requires KEDA CRDs and network access to Kafka.
    minReplicas: 3
    maxReplicas: 12 # Must not exceed topic partition count.
    lagThreshold: "1000"
    authenticationRef: "" # TriggerAuthentication for TLS/SASL; required when enabled.
ingress:
  enabled: false
  className: haproxy
  sticky:
    enabled: true
    provider: haproxy
    cookieName: voting_route
  host: voting.example.com
  tlsSecret: voting-tls
  annotations: {}
serviceMonitor:
  enabled: false
  labels: {}
networkPolicy:
  enabled: true
  ingressNamespace: haproxy-controller
  monitoringNamespace: monitoring
  dnsNamespace: kube-system
  dnsCIDRs: [] # NodeLocal DNS addresses as /32 or /128.
  # Narrow these destination CIDRs to database/Kafka endpoints in your environment.
  dependencyCIDRs: []
  databasePort: 5432
  kafkaPort: 9092
pdb:
  enabled: true
  minAvailable: 2
topologySpread:
  enabled: true
migration:
  enabled: true
  activeDeadlineSeconds: 120
  startupTimeoutSeconds: 90
lifecycle:
  shutdownTimeoutSeconds: 20
  terminationGracePeriodSeconds: 120
nodeSelector: {}
tolerations: []
